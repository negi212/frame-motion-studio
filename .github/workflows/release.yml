name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g., v0.1.0)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux (x86_64)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libopencv-dev clang libclang-dev pkg-config libgtk-3-dev llvm-dev
          # Verify opencv
          pkg-config --modversion opencv4 || echo "opencv pkg-config not found"
          llvm-config --version || llvm-config-14 --version || true
          echo "LLVM libdir: $(llvm-config --libdir 2>/dev/null || llvm-config-14 --libdir 2>/dev/null || echo 'not found')"
          ls -lh /usr/lib/llvm-*/lib/libclang* 2>/dev/null | head -20 || true
          ls -lh /usr/lib/x86_64-linux-gnu/libclang* 2>/dev/null | head -20 || true
          # For CI, remove custom .cargo/config.toml to use system llvm-config
          rm -f .cargo/config.toml
          rm -rf .libclang
          echo "Removed custom cargo config for CI"
          cat .cargo/config.toml 2>/dev/null || echo "no cargo config"

      - name: Build release
        run: cargo build --release --verbose

      - name: Check binary
        run: |
          ls -lh target/release/frame_motion_studio
          file target/release/frame_motion_studio
          ldd target/release/frame_motion_studio | head -30 || true

      - name: Install cargo-deb
        run: cargo install cargo-deb --locked

      - name: Build .deb
        run: cargo deb --no-build
        continue-on-error: true

      - name: Prepare artifacts
        run: |
          mkdir -p dist
          cp target/release/frame_motion_studio dist/frame_motion_studio-linux-x86_64 || cp target/release/frame-motion-studio dist/ 2>/dev/null || true
          # Ensure executable name (cargo deb expects target/release/frame_motion_studio)
          ls -lh dist/ target/debian/*.deb 2>/dev/null || true
          cp target/debian/*.deb dist/ 2>/dev/null || echo "no deb built"
          ls -lh dist/

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64
          path: |
            dist/*
            target/debian/*.deb

      - name: Create Release (tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*
            target/debian/*.deb
          generate_release_notes: true

      - name: Create Release (manual)
        if: github.event_name == 'workflow_dispatch' && !startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version || 'manual-release' }}
          files: |
            dist/*
            target/debian/*.deb
          generate_release_notes: true

  build-windows:
    name: Build Windows (x86_64)
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Install LLVM
        run: choco install llvm -y --no-progress
        shell: bash
        continue-on-error: true

      - name: Setup libclang env
        run: |
          echo "LIBCLANG_PATH=C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Get-ChildItem "C:\Program Files\LLVM\bin\libclang*.dll" | ForEach-Object { Write-Host $_.FullName }
          # Also try alternative location
          Get-ChildItem "C:\Program Files\LLVM\lib\libclang*.dll" -ErrorAction SilentlyContinue | ForEach-Object { Write-Host $_.FullName }
        shell: powershell

      - name: Install OpenCV (chocolatey - primary)
        run: |
          choco install opencv -y --no-progress
          if ($LASTEXITCODE -ne 0) { Write-Host "opencv choco install skipped" }
          Write-Host "=== Listing lib files (chocolatey) ==="
          Get-ChildItem "C:\tools\opencv\build\x64\vc16\lib\*.lib" -ErrorAction SilentlyContinue | ForEach-Object { Write-Host $_.Name }
        shell: powershell
        continue-on-error: true

      - name: Install OpenCV via vcpkg (fallback for correct version)
        run: |
          echo "Trying vcpkg for OpenCV 4.10 (static-md triplet to match OPENCV_MSVC_CRT=static)"
          vcpkg --version
          # The opencv crate with OPENCV_MSVC_CRT=static expects x64-windows-static-md
          vcpkg install opencv4[core,imgproc,video,videoio,imgcodecs]:x64-windows-static-md --recurse --clean-after-build
          if ($LASTEXITCODE -eq 0) {
            Write-Host "vcpkg opencv installed (static-md)"
            $vcpkgRoot = $env:VCPKG_INSTALLATION_ROOT
            if (-not $vcpkgRoot) { $vcpkgRoot = "C:\vcpkg" }
            echo "VCPKG_ROOT=$vcpkgRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            echo "OPENCV_PACKAGE_NAME=opencv4" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            echo "VCPKGRS_DYNAMIC=0" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            # Also set standard envs for fallback
            $inc = "$vcpkgRoot\installed\x64-windows-static-md\include"
            $lib = "$vcpkgRoot\installed\x64-windows-static-md\lib"
            if (Test-Path $inc) { echo "OPENCV_INCLUDE_PATHS=$inc" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append }
            if (Test-Path $lib) { echo "OPENCV_LINK_PATHS=$lib" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append }
          } else {
            Write-Host "vcpkg static-md failed, trying x64-windows"
            vcpkg install opencv4:x64-windows --recurse --clean-after-build
            if ($LASTEXITCODE -eq 0) {
              $vcpkgRoot = $env:VCPKG_INSTALLATION_ROOT
              if (-not $vcpkgRoot) { $vcpkgRoot = "C:\vcpkg" }
              echo "VCPKG_ROOT=$vcpkgRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
              echo "OPENCV_PACKAGE_NAME=opencv4" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            } else {
              Write-Host "vcpkg install failed, fallback to chocolatey paths"
              # Fallback to chocolatey paths with auto-detection
              $world = Get-ChildItem "C:\tools\opencv\build\x64\vc16\lib\opencv_world*.lib" -ErrorAction SilentlyContinue | Select-Object -First 1
              $libs = @()
              if ($null -ne $world) { $libs += $world.BaseName }
              $tracking = Get-ChildItem "C:\tools\opencv\build\x64\vc16\lib\opencv_tracking*.lib" -ErrorAction SilentlyContinue | Select-Object -First 1
              if ($null -ne $tracking) { $libs += $tracking.BaseName }
              if ($libs.Count -eq 0) { $libs = @("opencv_world410") }
              $libsStr = $libs -join ","
              Write-Host "Fallback libs: $libsStr"
              echo "OPENCV_LINK_LIBS=$libsStr" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
              echo "OPENCV_LINK_PATHS=C:\tools\opencv\build\x64\vc16\lib" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
              echo "OPENCV_INCLUDE_PATHS=C:\tools\opencv\build\include" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            }
          }
        shell: powershell
        continue-on-error: true

      - name: Build release
        run: cargo build --release --verbose
        shell: bash
        env:
          OPENCV_MSVC_CRT: static

      - name: Check binary
        run: |
          dir target\release\frame_motion_studio.exe
          dir target\release\*.exe
        shell: powershell

      - name: Create portable zip
        run: |
          mkdir dist
          Copy-Item target\release\frame_motion_studio.exe dist\frame_motion_studio-windows-x86_64.exe -ErrorAction SilentlyContinue
          Copy-Item target\release\frame_motion_studio.exe dist\ -ErrorAction SilentlyContinue
          # Also copy OpenCV DLLs (any version)
          Get-ChildItem "C:\tools\opencv\build\x64\vc16\bin\opencv_world*.dll" | ForEach-Object { Copy-Item $_.FullName dist\ }
          Get-ChildItem "C:\tools\opencv\build\x64\vc16\bin\opencv_videoio_ffmpeg*.dll" | ForEach-Object { Copy-Item $_.FullName dist\ }
          # Fallback for other locations
          if (Test-Path "C:\tools\opencv\build\x64\vc16\bin\opencv_world410.dll") {
            Copy-Item "C:\tools\opencv\build\x64\vc16\bin\opencv_world410.dll" dist\ -ErrorAction SilentlyContinue
          }
          Compress-Archive -Path dist\* -DestinationPath frame_motion_studio-windows-x86_64.zip -Force
          dir dist
          dir *.zip
        shell: powershell

      - name: Install WiX Toolset
        run: choco install wixtoolset -y --no-progress
        shell: powershell
        continue-on-error: true

      - name: Install cargo-wix
        run: cargo install cargo-wix --locked
        continue-on-error: true

      - name: Build MSI installer
        run: cargo wix --nocapture --install-cargo-wix || echo "wix build skipped"
        shell: bash
        continue-on-error: true

      - name: List wix output
        run: |
          dir target\wix\*.msi -ErrorAction SilentlyContinue
          dir target\wix -ErrorAction SilentlyContinue
        shell: powershell
        continue-on-error: true

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-x86_64
          path: |
            frame_motion_studio-windows-x86_64.zip
            dist/*
            target/wix/*.msi

      - name: Create Release (tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            frame_motion_studio-windows-x86_64.zip
            target/wix/*.msi
          generate_release_notes: true

      - name: Create Release (manual)
        if: github.event_name == 'workflow_dispatch' && !startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version || 'manual-release' }}
          files: |
            frame_motion_studio-windows-x86_64.zip
            target/wix/*.msi
          generate_release_notes: true
